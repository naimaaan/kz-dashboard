settings:
  max_concurrent: 3
  vulhub_dir: C:/Users/Asus/Desktop/vulhub
  protected_service_names:
    - dashboard-api
    - dashboard-web
services:
  wordpress-custom:
    display_name: WordPress (Custom)
    description: CMS platform with exploitable plugins (SQLi, file upload RCE)
    category: custom
    container_name: kz-wordpress
    network: kz-sploitable_vuln_net
    ports:
      - "8080:80"
    env:
      WORDPRESS_DB_HOST: kz-mysql:3306
      WORDPRESS_DB_USER: root
      WORDPRESS_DB_PASSWORD: root
    profiles:
      easy:
        image: nginx:1.25-alpine
        label: Easy - All vulnerabilities active
        cves: []
      medium:
        image: nginx:1.26-alpine
        label: Medium - Limited vulnerabilities
        cves: []
      hard:
        image: nginx:1.27-alpine
        label: Hard - Fully patched
        cves: []
    active_profile: hard
    switchable: true
    variant_mode: image
    active_variant: easy
    last_good_variant: easy
    variants:
      easy:
        image: nginx:1.25-alpine
        label: Easy - All vulnerabilities active
        cves: []
        healthcheck:
          type: http
          path: /
          timeout_sec: 20
      medium:
        image: nginx:1.26-alpine
        label: Medium - Limited vulnerabilities
        cves: []
        healthcheck:
          type: http
          path: /
          timeout_sec: 20
      hard:
        image: nginx:1.27-alpine
        label: Hard - Fully patched
        cves: []
        healthcheck:
          type: http
          path: /
          timeout_sec: 20
